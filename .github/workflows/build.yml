# 仓库根目录假定同时包含 android/ 与 framework/ 两个平级目录
# （app/build.gradle.kts 里的 sourceSets 用的是 ../framework/src）。
#
# 版本不降级：AGP 9.4.1 + Gradle 9.7.1 + Kotlin 2.4.10 + compileSdk 37 都是已存在的版本，
# 且 mikepenz markdown 0.45.0 的 POM 明确要求 kotlin-stdlib 2.4.10 —— 降 Kotlin 会读不了它的元数据。
# 这里做的是把 CI 缺的 SDK 组件补上。
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建 Release 需要
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # AGP 靠环境变量找 SDK（仓库里没有 local.properties）。
      # runner 镜像本来就设了，这里显式断言一次：设了给下游，没设就当场红，
      # 而不是等到 assembleDebug 才报 "SDK location not found"。
      - name: 记录 Android SDK 路径
        run: |
          : "${ANDROID_HOME:?runner 没有设置 ANDROID_HOME}"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          } >> "$GITHUB_ENV"

      # 镜像自带的 SDK 不一定包含 compileSdk 37 / build-tools 37.0.0，显式装一次
      - name: 安装 SDK 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      # 契约自测：131 + 23 条断言。这一步挂了，说明是框架的问题，不是 App 的
      - name: 框架契约自测
        working-directory: framework
        run: MYCHAT_JDK="$JAVA_HOME" sh build.sh

      - name: assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # artifact 的 size 是压缩包，不是 APK 真实体积；这里打一遍
      - name: 记录 APK 真实体积
        run: |
          ls -l app/build/outputs/apk/debug/
          for f in app/build/outputs/apk/debug/*.apk; do
            echo "APK_BYTES=$(stat -c %s "$f") $f"
          done

      # release 走 R8 + resource shrink：debug 从不跑这一段，
      # 不在这里验一次，proguard 的洞会一直藏到发版那天。
      - name: assembleRelease
        run: |
          ./gradlew assembleRelease --stacktrace
          for f in app/build/outputs/apk/release/*.apk; do
            echo "RELEASE_APK_BYTES=$(stat -c %s "$f") $f"
          done

      # 负向验证：框架类必须真的进了编译产物。
      # 历史上 sourceSets 漂移过一次：源码没被编译，但因为没有 import，构建仍然是绿的。
      - name: 验证框架类真的被编译
        run: |
          set -e
          FOUND=$(find app/build -name "ModuleDispatcher*.class" | head -5)
          echo "$FOUND"
          test -n "$FOUND" || { echo "::error::框架类没有被编译，检查 sourceSets"; exit 1; }

      - name: 打包 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Kotlin 编译错通常只在报告里给出文件名与行号，单独留一份方便贴出来
      # 打 tag（v*）时建 Release，手机点链接就能下载装包
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: 打包编译报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
