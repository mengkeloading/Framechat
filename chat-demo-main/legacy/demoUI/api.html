<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>API 配置</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="settings-header">
  <div class="back-btn" onclick="window.location.href='settings.html'"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></div>
  <div>API 配置</div>
</div>
<div class="settings-content">
  <div class="group-title">API 配置管理</div>
  <div style="background:var(--bg-card);border-radius:16px;padding:16px;">
    <div style="color:var(--primary);font-size:16px;font-weight:600;margin-bottom:4px;">DeepSeek 官方</div>
    <div style="font-size:13px;color:var(--text-sub);margin-bottom:8px;">DeepSeek 官方 · deepseek-flash<br>https://api.deepseek.com</div>
    <div style="font-size:12px;color:#666;margin-bottom:16px;">修改后自动保存，仅保存在本机。</div>
    <label>API Key</label>
    <input type="password" class="setting-input" id="apiKeyInput" placeholder="sk-...">
    <button onclick="saveApiKey()" style="margin-top:16px;width:100%;padding:12px;background:var(--primary);color:white;border:none;border-radius:8px;font-weight:bold;">保存</button>
  </div>
</div>
<script src="app.js"></script>
<script>
  document.getElementById('apiKeyInput').value = localStorage.getItem('ds_key') || '';
</script>
</body>
</html>
